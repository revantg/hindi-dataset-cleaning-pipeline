[project]
name = "dataset-cleaning-assignment"
version = "0.1.0"
description = "ERA V5 Session 4 data cleaning assignment workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "GlotScript==2.0",
    "datasets>=5.0.1",
    "extruct>=0.18.0",
    "fasttext-wheel==0.9.2",
    "huggingface-hub>=1.26.0",
    "inscriptis>=2.7.3",
    "justext>=3.0.2",
    "lingua-language-detector==2.2.0",
    "numpy<2",
    "readability-lxml>=0.8.4.1",
    "resiliparse>=1.0.9",
    "tiktoken>=0.13.0",
    "tqdm>=4.70.0",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "marimo>=0.23.16",
    "pydantic-ai>=2.21.0",
    "ruff>=0.16.1",
]

[tool.ruff.lint.per-file-ignores]
# marimo notebooks: each cell is a function whose final bare expression is the
# rendered output (B018) and whose generated wrapper ends in `return` (PLR1711).
# Both are intrinsic to marimo's saved format, not authoring defects.
"deduplication/deduplication.py" = ["B018", "PLR1711"]
"manifest-provenance/manifest_provenance.py" = ["PLR1711"]
